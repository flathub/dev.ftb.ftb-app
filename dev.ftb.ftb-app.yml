app-id: dev.ftb.ftb-app
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ftb.sh

finish-args:
  - --socket=x11
  # Disable wayland for now, were running into too many issues with minecraft/mods not behaving properly
  # - --socket=wayland
  # - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --share=ipc
  - --share=network
  - --filesystem=~/.ftba:create # Home folder for the FTB App
  - --filesystem=xdg-run/app/com.discordapp.Discord:create # Needed for mods that integrate with Discord RPC

  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
# Credit to the prism flatpak manifest for the gamemode module
  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-sd-bus-provider=no-daemon
      - -Dwith-examples=false
    post-install:
      # gamemoderun is installed for users who want to use wrapper commands
      # post-install is running inside the build dir, we need it from the source though
      - install -Dm755 ../data/gamemoderun -t /app/bin
    sources:
      - type: archive
        dest-filename: gamemode.tar.gz
        url: https://api.github.com/repos/FeralInteractive/gamemode/tarball/1.8.2
        sha256: 2886d4ce543c78bd2a364316d5e7fd59ef06b71de63f896b37c6d3dc97658f60
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FeralInteractive/gamemode/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          timestamp-query: .published_at
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/libgamemodeauto.a

  - name: ftb-app
    buildsystem: simple
    build-commands:
      - chmod +x FTB-App-linux-setup.AppImage
      - ./FTB-App-linux-setup.AppImage --appimage-extract
      - cp -r squashfs-root /app/bin/ftb-app
      - install -D icon.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -D ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -D ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -D ftb.sh /app/bin
    sources:
      - type: file
        dest-filename: FTB-App-linux-setup.AppImage
        url: https://piston.feed-the-beast.com/app/ftb-app-linux-1.30.0-beta.359-x86_64.AppImage
        sha512: 4a712e47e75ec6e23a3bf665e5eb39ce98f45bf1e9199841cb6be550f9c0318ee685072834a801ca9069622d8f6ca433f4f19cfabb94bfd1da19bc3b74627e4f
        only-arches:
          - x86_64
        x-checker-data:
          type: electron-updater
          url: https://piston.feed-the-beast.com/app/beta-linux.yml

      - type: file
        dest-filename: FTB-App-linux-setup.AppImage
        url: https://piston.feed-the-beast.com/app/ftb-app-linux-1.30.0-beta.359-arm64.AppImage
        sha512: 415d8bf08ffa1ff2a4a83150446d2e080c14a6c170d51c24a8fcbdc8ed35ad80a65ac70de5831e0fb3cc4e9ee1bf66db3a751ba7e8977c5ddec17a8df4c8d35c
        only-arches:
          - aarch64
        x-checker-data:
          type: electron-updater
          url: https://piston.feed-the-beast.com/app/beta-linux-arm64.yml

      - type: file
        url: https://github.com/FTBTeam/FTB-App/raw/dev/flathub/dev.ftb.ftb-app.desktop
        sha256: ba55b59a5bd69b8683e7b9a81834d79110860dca8d950eb194941a74aa64c7cc

      - type: file
        url: https://github.com/FTBTeam/FTB-App/raw/dev/resources/icon.png
        sha256: fbdd6af27ba157d308884d2f3831c12c3d1d1464b60d8b08ef76cae8ff30cc4f

      - type: file
        url: https://raw.githubusercontent.com/FTBTeam/FTB-App/dev/flathub/dev.ftb.ftb-app.metainfo.xml?version=caa8b48ad75352ad9951065eb1fa0859eac0f957
        sha512: 63239cb406f53f919e8d080f1102d62fea6f8066418cec813870bed1e3e23d25643f5b52ef8df3f415037356a38531bcde74bd5d2402a9206e066f36eed323a5
        x-checker-data:
          type: json
          url: https://api.github.com/repos/FTBTeam/FTB-App/contents/flathub/dev.ftb.ftb-app.metainfo.xml
          version-query: .sha
          url-query: '"https://raw.githubusercontent.com/FTBTeam/FTB-App/dev/flathub/dev.ftb.ftb-app.metainfo.xml?version=\($version)"'
      - type: script
        commands:
          - |
            # Discord IPC support
            for i in {0..9}; do
              test -S $XDG_RUNTIME_DIR/discord-ipc-$i || ln -sf {app/com.discordapp.Discord,$XDG_RUNTIME_DIR}/discord-ipc-$i;
            done
            export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"

            rm -f ~/.ftba/app.pid # Temp fix for --ignore-pid-checks not working
            echo "Passing the following flags to electron:" "$@"
            exec zypak-wrapper /app/bin/ftb-app/ftb-app "$@" --ignore-pid-checks --ozone-platform=x11
        dest-filename: ftb.sh
